# 팔레트 (https://coolors.co/palette/ffffff-f5f5f5-ebebeb-e0e0e0-d6d6d6)

@white = #ffffff
@smoke = #f5f5f5
@platinum = #ebebeb
@alabaster = #e0e0e0
@dust = #d6d6d6
@foreground = #282828
@accentColor = #6f94b8

# 표준 Swing 컨트롤의 기본 배경·선택·글자색은 FlatLaf가 적용합니다.
@background = @smoke
@buttonBackground = @white
@componentBackground = @white
@menuBackground = @white
@disabledBackground = @smoke
@disabledForeground = @foreground
@selectionBackground = @alabaster
@selectionForeground = @foreground
@selectionInactiveBackground = @alabaster
@selectionInactiveForeground = @foreground
@menuSelectionBackground = @platinum
@menuAcceleratorForeground = @foreground
@menuAcceleratorSelectionForeground = @foreground
@buttonArrowColor = @foreground
@icon = @foreground

Component.borderColor = @dust
Component.disabledBorderColor = @alabaster
Component.focusColor = @dust
Component.focusedBorderColor = @dust
Button.hoverBackground = @smoke
Button.pressedBackground = @alabaster
Button.focusedBackground = @smoke
Button.hoverBorderColor = @dust
TextField.inactiveBackground = @white
TextArea.inactiveBackground = @white
Separator.foreground = @dust
ScrollBar.track = @smoke
ScrollBar.thumb = @dust
ScrollBar.hoverThumbColor = @dust
ScrollBar.pressedThumbColor = @dust

# [비율] 글꼴 종류는 운영체제별 FlatLaf 기본값을 유지하고 크기만 정합니다.
defaultFont = 13
small.font = 11
Custom.Node.typeFont = 11 $monospaced.font
TabbedPane.tabHeight = 36
TabbedPane.contentBorderInsets = 0,0,0,0
TabbedPane.selectedBackground = @white
TabbedPane.underlineColor = @dust
TabbedPane.inactiveUnderlineColor = @dust
TabbedPane.hoverColor = @platinum
TabbedPane.contentAreaColor = @dust
Table.gridColor = @platinum
TableHeader.background = @platinum
TableHeader.separatorColor = @alabaster
TableHeader.bottomSeparatorColor = @alabaster
TableHeader.hoverBackground = @alabaster
TableHeader.pressedBackground = @dust
PopupMenu.borderColor = @dust
CheckBox.icon.borderColor = @dust
CheckBox.icon.selectedBorderColor = @dust
CheckBox.icon.background = @white
CheckBox.icon.selectedBackground = @platinum
CheckBox.icon.checkmarkColor = @foreground
CheckBox.icon.focusedBorderColor = @dust
CheckBox.icon.hoverBorderColor = @dust
CheckBox.icon.hoverBackground = @smoke
CheckBox.icon.pressedBackground = @alabaster

Custom.Header.background = @platinum
Custom.Node.selectedBackground = @smoke
Custom.Node.selectedHeaderBackground = @alabaster
Custom.Connection.lineColor = @accentColor
